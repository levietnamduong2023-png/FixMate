services:
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (error) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/fixmate?replicaSet=rs0
      CLIENT_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-MOCK}
      PAYMENT_API_BASE_URL: ${PAYMENT_API_BASE_URL:-}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-development-webhook-secret}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-CONSOLE}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      OBJECT_STORAGE_SIGNER_URL: ${OBJECT_STORAGE_SIGNER_URL:-}
      OBJECT_STORAGE_API_KEY: ${OBJECT_STORAGE_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fixmate.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-FixMate Admin}
    command: ["sh", "-c", "npm run seed && npm start"]

volumes:
  mongo-data:
